[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "karma-test-selector"
dynamic = ["version"]
description = "Run only the tests affected by your change: static, dependency-aware test selection for pytest."
readme = "Readme.MD"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Karma contributors" }]
keywords = ["pytest", "testing", "ci", "test-selection", "test-impact-analysis", "github-actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ['tomli>=1.1; python_version < "3.11"']

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
karma = "karma.cli:main"

[project.urls]
Homepage = "https://github.com/Pradyuman-aviator/Karma"
Issues = "https://github.com/Pradyuman-aviator/Karma/issues"

[tool.hatch.version]
path = "karma/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["karma"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["karma"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PIE",
    "RET",
    "PT",       # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
strict = true
warn_unreachable = true
files = ["karma"]
