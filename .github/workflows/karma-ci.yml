name: Karma CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  karma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Karma
        id: karma
        uses: ./
        with:
          base-branch: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}

      - name: Show affected tests
        run: echo "Affected: ${{ steps.karma.outputs.test_files }}"
