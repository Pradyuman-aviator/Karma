name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

  # Karma selecting and running its own tests, through the action exactly as users call it.
  dogfood:
    name: Karma on Karma (fetch-depth ${{ matrix.fetch-depth }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fetch-depth: [0, 1] # 1 exercises the action's shallow-clone recovery
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - id: karma
        uses: ./
        with:
          args: --explain
          prioritize: "true"
      - name: Show outputs
        run: |
          echo "selected: ${{ steps.karma.outputs.selected-count }} of ${{ steps.karma.outputs.total-count }}"
          echo "run-all:  ${{ steps.karma.outputs.run-all }}"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t karma .
      - run: docker run --rm karma --version
