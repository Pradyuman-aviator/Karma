name: Karma Smart Test Selector
description: Run only the pytest tests affected by your change, using static import analysis
author: Karma contributors
branding:
  icon: zap
  color: orange

inputs:
  base-branch:
    description: >-
      Git ref to compare against. Default: the pull request's base branch, or the
      previous commit for a push.
    required: false
    default: ""
  command:
    description: "`run` to select and run tests with pytest, or `select` to only compute the selection."
    required: false
    default: run
  python:
    description: >-
      Python interpreter to use. It must have pytest and your project's dependencies
      installed (e.g. set up by actions/setup-python). Default: `python`, else `python3`.
    required: false
    default: ""
  pytest-args:
    description: Extra arguments for pytest, separated by spaces (e.g. `-x -n auto`).
    required: false
    default: ""
  working-directory:
    description: Directory of the Python project, relative to the repository root.
    required: false
    default: "."
  on-git-error:
    description: "If changes cannot be determined: `fail`, or `run-all` to run the full suite."
    required: false
    default: fail
  args:
    description: Extra arguments for Karma itself, separated by spaces (e.g. `--explain`).
    required: false
    default: ""
  prioritize:
    description: >-
      `true` to run the tests most likely to fail first, predicted from the recorded test
      history. Combine with `pytest-args: -x` to stop at the first failure.
    required: false
    default: "false"
  retries:
    description: >-
      Re-run failed tests up to this many times. A test that passes on retry is reported
      as flaky (a warning, not a failure) and recorded for `karma flaky sync`.
    required: false
    default: "0"
  cache:
    description: >-
      `true` to keep `.karma_cache/` (import cache and test history) between runs with
      actions/cache, so history accumulates and graphs build faster.
    required: false
    default: "true"
  diagnose:
    description: >-
      `true` to explain each failure in the job summary and on the diff: the changed lines
      in its traceback, why the test ran, and its history. Computed locally.
    required: false
    default: "false"
  ai:
    description: >-
      Also ask a language model to explain failures: `anthropic` (set `ANTHROPIC_API_KEY`
      in the step's `env` from a secret), `ollama` or `openai` (any OpenAI-compatible
      server). Off by default; the model is sent each failure's traceback and diff.
    required: false
    default: ""
  ai-model:
    description: "Model for `ai`; the default for `anthropic` is claude-sonnet-5."
    required: false
    default: ""

outputs:
  test_files:
    description: Space-separated list of the selected test files
    value: ${{ steps.karma.outputs.test_files }}
  tests-run:
    description: Number of test files that were run
    value: ${{ steps.karma.outputs.tests-run }}
  selected-count:
    description: Number of test files selected
    value: ${{ steps.karma.outputs.selected-count }}
  total-count:
    description: Number of test files in the project
    value: ${{ steps.karma.outputs.total-count }}
  run-all:
    description: "`true` when a change (e.g. to pyproject.toml) selected the whole suite"
    value: ${{ steps.karma.outputs.run-all }}
  flaky-tests:
    description: Space-separated node ids of tests that failed, then passed on retry
    value: ${{ steps.karma.outputs.flaky-tests }}

runs:
  using: composite
  steps:
    - if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/.karma_cache
        # A new entry every run (history grows); restore the newest from this branch,
        # else from the default branch (so pull requests start with its history).
        key: karma-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          karma-${{ runner.os }}-${{ github.ref_name }}-
          karma-${{ runner.os }}-${{ github.event.repository.default_branch }}-
          karma-${{ runner.os }}-
    - id: karma
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs are passed through the environment, never interpolated into the script.
      env:
        KARMA_ACTION_PATH: ${{ github.action_path }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PYTHON: ${{ inputs.python }}
        INPUT_PYTEST_ARGS: ${{ inputs.pytest-args }}
        INPUT_ON_GIT_ERROR: ${{ inputs.on-git-error }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_PRIORITIZE: ${{ inputs.prioritize }}
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_DIAGNOSE: ${{ inputs.diagnose }}
        INPUT_AI: ${{ inputs.ai }}
        INPUT_AI_MODEL: ${{ inputs.ai-model }}
        KARMA_EVENT_BEFORE: ${{ github.event.before }}
        KARMA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "$KARMA_ACTION_PATH/entrypoint.sh"
