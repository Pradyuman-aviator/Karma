name: Karma Smart Test Selector
description: Runs only the tests affected by your code changes using AST analysis

inputs:
  base-branch:
    description: The base branch or commit to diff against
    required: false
    default: main

outputs:
  test_files:
    description: Space-separated list of affected test files
  tests-run:
    description: Number of tests that were executed

runs:
  using: docker
  image: Dockerfile

branding:
  icon: zap
  color: orange
